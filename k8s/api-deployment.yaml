apiVersion: apps/v1
kind: Deployment
metadata:
  name: pente-api
  labels:
    app: pente-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pente-api
  template:
    metadata:
      labels:
        app: pente-api
    spec:
      containers:
        - name: pente-api
          image: pente-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pente-api-config
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: pente-secrets
                  key: MONGODB_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pente-secrets
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pente-secrets
                  key: GEMINI_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
